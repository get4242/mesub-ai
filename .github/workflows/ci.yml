name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm security:audit
      - run: git grep -nE '(sk-proj-|OPENAI_API_KEY=.{12,})' -- ':!pnpm-lock.yaml' ':!.env.example' && exit 1 || true
      # Cloud migration/RLS verification runs only in a protected environment with
      # dedicated Development credentials; CI never embeds or defaults to Production.
